<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Darts Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
  :root {
    --bg-dark: #000;
    --bg-light: #f5f5f5;
    --text-dark: #fff;
    --text-light: #111;
    --accent: #0a84ff;
    --highlight: #ffcc00;
    --double: #b00020;
    --treble: #00701a;
    --single: #222;
  }

  body.dark { background: var(--bg-dark); color: var(--text-dark); }
  body.light { background: var(--bg-light); color: var(--text-light); }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: manipulation;
  }

  header {
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #333;
  }

  header h1 { margin: 0; font-size: 1.3rem; }

  .theme-toggle {
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #555;
    background: transparent;
    color: inherit;
  }

  main { padding: 1rem; max-width: 520px; margin: auto; }

  .card {
    background: rgba(28,28,30,0.9);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  body.light .card { background: #fff; }

  .row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; }
  .row > div { flex: 1 1 180px; }

  label { font-size: 0.85rem; margin-bottom: 0.2rem; display: block; }

  input, select {
    width: 100%;
    padding: 0.6rem;
    border-radius: 10px;
    border: 1px solid #555;
    background: #1c1c1e;
    color: inherit;
  }

  body.light input, body.light select { background: #f5f5f5; }

  button {
    padding: 0.7rem 1rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
  }

  button.primary { background: var(--accent); color: #fff; width: 100%; }
  button.secondary { background: #34c759; color: #fff; }
  button.danger { background: #ff3b30; color: #fff; }

  .turn-banner {
    font-size: 1.3rem;
    font-weight: 700;
    text-align: center;
    padding: 0.6rem;
    background: #222;
    border-radius: 10px;
    margin-bottom: 0.6rem;
  }

  .dartboard-wrapper { display: flex; justify-content: center; margin-bottom: 0.6rem; }

  svg.dartboard { width: 280px; height: 280px; }

  .ring-single { fill: var(--single); stroke: #444; stroke-width: 0.5; cursor: pointer; }
  .ring-double { fill: var(--double); stroke: #444; stroke-width: 0.5; cursor: pointer; }
  .ring-treble { fill: var(--treble); stroke: #444; stroke-width: 0.5; cursor: pointer; }

  .segment-highlight { stroke: var(--highlight); stroke-width: 2; }

  .bull-inner { fill: #ff3b30; cursor: pointer; }
  .bull-outer { fill: #ffaa00; cursor: pointer; }

  .number-label {
    fill: #fff;
    font-size: 8px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .scoreboard-item { font-size: 0.85rem; margin-bottom: 0.2rem; }

  .random-instruction {
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 0.6rem;
  }
</style>
</head>

<body class="dark">
<header>
  <h1>Darts Tracker</h1>
  <button class="theme-toggle" id="themeToggle">Light</button>
</header>

<main>

  <!-- Setup Screen -->
  <section class="card" id="setupCard">
    <h2>Game Setup</h2>

    <div class="row">
      <div>
        <label>Game Mode</label>
        <select id="gameMode">
          <option value="standard">Standard</option>
          <option value="around">Around the World</option>
          <option value="random">Random Shot Selector</option>
        </select>
      </div>

      <div>
        <label>Starting Score</label>
        <select id="startingScore">
          <option value="301">301</option>
          <option value="501" selected>501</option>
          <option value="901">901</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Players</label>
        <input type="number" id="playerCount" min="1" max="8" value="2">
      </div>
      <div>
        <label><input type="checkbox" id="finishOnDouble" checked> Finish on Double</label>
      </div>
    </div>

    <div class="card">
      <h3>Player Names</h3>
      <div id="playerNames"></div>
    </div>

    <button class="primary" id="startGameBtn">Start Game</button>
  </section>

  <!-- Game Screen -->
  <section class="card hidden" id="gameCard">

    <div class="turn-banner" id="turnBanner">PLAYER TURN</div>

    <div class="random-instruction hidden" id="randomInstruction"></div>

    <div class="dartboard-wrapper">
      <svg class="dartboard" viewBox="0 0 200 200" id="dartboardSvg">
        <circle cx="100" cy="100" r="95" fill="#111" stroke="#666" stroke-width="2"></circle>
        <g id="ringsGroup"></g>

        <circle class="bull-outer" cx="100" cy="100" r="15" data-score="25" data-type="outerBull"></circle>
        <circle class="bull-inner" cx="100" cy="100" r="7" data-score="50" data-type="bull"></circle>
      </svg>
    </div>

    <p id="turnTotalText">Turn Total: 0</p>

    <div class="row">
      <button class="secondary" id="undoBtn">Undo Last Dart</button>
      <button class="primary" id="endTurnBtn">End Turn</button>
    </div>

    <div id="scoreboard"></div>

    <button class="danger" id="resetGameBtn">Reset Game</button>

  </section>

</main>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");

function haptic() { if (navigator.vibrate) navigator.vibrate(30); }

const state = {
  mode: "standard",
  players: [],
  currentPlayer: 0,
  turnTotal: 0,
  lastDarts: [],
  randomTarget: null,
  completedTargets: []
};

const setupCard = document.getElementById("setupCard");
const gameCard = document.getElementById("gameCard");
const playerNamesDiv = document.getElementById("playerNames");
const turnBanner = document.getElementById("turnBanner");
const turnTotalText = document.getElementById("turnTotalText");
const scoreboard = document.getElementById("scoreboard");
const randomInstruction = document.getElementById("randomInstruction");
const ringsGroup = document.getElementById("ringsGroup");

document.getElementById("playerCount").addEventListener("change", renderNameInputs);

function renderNameInputs() {
  const count = parseInt(document.getElementById("playerCount").value);
  playerNamesDiv.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = `Player ${i+1}`;
    input.dataset.index = i;
    playerNamesDiv.appendChild(input);
  }
}
renderNameInputs();

document.getElementById("startGameBtn").addEventListener("click", startGame);

function startGame() {
  const count = parseInt(document.getElementById("playerCount").value);
  const nameInputs = playerNamesDiv.querySelectorAll("input");

  state.players = [];
  for (let i = 0; i < count; i++) {
    const name = nameInputs[i].value.trim() || `Player ${i+1}`;
    state.players.push({
      name,
      score: parseInt(document.getElementById("startingScore").value),
      completed: []
    });
  }

  state.mode = document.getElementById("gameMode").value;
  state.currentPlayer = 0;
  state.turnTotal = 0;
  state.lastDarts = [];

  setupCard.classList.add("hidden");
  gameCard.classList.remove("hidden");

  updateTurnBanner();
  renderScoreboard();
  createDartboard();
  if (state.mode === "random") generateRandomTarget();
}

function updateTurnBanner() {
  turnBanner.textContent = `🎯 ${state.players[state.currentPlayer].name.toUpperCase()}'S TURN`;
}

function renderScoreboard() {
  scoreboard.innerHTML = "";
  state.players.forEach(p => {
    const div = document.createElement("div");
    div.className = "scoreboard-item";
    div.textContent = `${p.name}: ${p.score}`;
    scoreboard.appendChild(div);
  });
}

function polar(cx, cy, r, angle) {
  return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
}

function ringPath(cx, cy, r1, r2, a1, a2) {
  const p1 = polar(cx, cy, r2, a1);
  const p2 = polar(cx, cy, r2, a2);
  const p3 = polar(cx, cy, r1, a2);
  const p4 = polar(cx, cy, r1, a1);
  const large = a2 - a1 > Math.PI ? 1 : 0;

  return `M ${p1.x} ${p1.y}
          A ${r2} ${r2} 0 ${large} 1 ${p2.x} ${p2.y}
          L ${p3.x} ${p3.y}
          A ${r1} ${r1} 0 ${large} 0 ${p4.x} ${p4.y}
          Z`;
}

function createDartboard() {
  const numbers = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const cx = 100, cy = 100;
  const step = (Math.PI*2)/20;

  ringsGroup.innerHTML = "";

  numbers.forEach((num, i) => {
    const a1 = -Math.PI/2 + i*step;
    const a2 = a1 + step;

    const single = document.createElementNS("http://www.w3.org/2000/svg","path");
    single.setAttribute("d", ringPath(cx,cy,60,80,a1,a2));
    single.setAttribute("class","ring-single");
    single.dataset.score = num;
    single.dataset.type = "single";
    single.dataset.number = num;
    single.addEventListener("click", () => hitSegment(single));

    const double = document.createElementNS("http://www.w3.org/2000/svg","path");
    double.setAttribute("d", ringPath(cx,cy,80,90,a1,a2));
    double.setAttribute("class","ring-double");
    double.dataset.score = num;
    double.dataset.type = "double";
    double.dataset.number = num;
    double.addEventListener("click", () => hitSegment(double));

    const treble = document.createElementNS("http://www.w3.org/2000/svg","path");
    treble.setAttribute("d", ringPath(cx,cy,50,60,a1,a2));
    treble.setAttribute("class","ring-treble");
    treble.dataset.score = num;
    treble.dataset.type = "treble";
    treble.dataset.number = num;
    treble.addEventListener("click", () => hitSegment(treble));

    ringsGroup.appendChild(single);
    ringsGroup.appendChild(double);
    ringsGroup.appendChild(treble);

    const mid = polar(cx,cy,95,(a1+a2)/2);
    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("x",mid.x);
    label.setAttribute("y",mid.y);
    label.setAttribute("class","number-label");
    label.textContent = num;
    ringsGroup.appendChild(label);
  });

  document.querySelector(".bull-inner").addEventListener("click", () => hitBull(50,"bull"));
  document.querySelector(".bull-outer").addEventListener("click", () => hitBull(25,"outerBull"));
}

function clearHighlights() {
  document.querySelectorAll(".ring-single,.ring-double,.ring-treble,.bull-inner,.bull-outer")
    .forEach(el => el.classList.remove("segment-highlight"));
}

function generateRandomTarget() {
  clearHighlights();

  const numbers = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const multipliers = ["single","double","treble"];
  const specials = ["bull","outerBull"];

  let target;

  if (Math.random() < 0.2) {
    const s = specials[Math.floor(Math.random()*specials.length)];
    target = { num: s==="bull"?50:25, mult:s };
  } else {
    const num = numbers[Math.floor(Math.random()*numbers.length)];
    const mult = multipliers[Math.floor(Math.random()*multipliers.length)];
    target = { num, mult };
  }

  state.randomTarget = target;

  if (target.mult === "bull") {
    randomInstruction.textContent = "HIT INNER BULL (50)";
    document.querySelector(".bull-inner").classList.add("segment-highlight");
  } else if (target.mult === "outerBull") {
    randomInstruction.textContent = "HIT OUTER BULL (25)";
    document.querySelector(".bull-outer").classList.add("segment-highlight");
  } else {
    randomInstruction.textContent = `HIT ${target.mult.toUpperCase()} ${target.num}`;
    document.querySelectorAll(`.ring-${target.mult}[data-number="${target.num}"]`)
      .forEach(el => el.classList.add("segment-highlight"));
  }

  randomInstruction.classList.remove("hidden");
}

function hitSegment(el) {
  const num = parseInt(el.dataset.number);
  const type = el.dataset.type;
  let value = num;

  if (type==="double") value = num*2;
  if (type==="treble") value = num*3;

  if (state.mode==="random") {
    const t = state.randomTarget;
    const required =
      t.mult==="single"?t.num:
      t.mult==="double"?t.num*2:
      t.mult==="treble"?t.num*3:t.num;

    if (value !== required) {
      haptic();
      return;
    }

    state.players[state.currentPlayer].completed.push(`${t.mult}-${t.num}`);
    checkWinner();
    generateRandomTarget();
  }

  state.turnTotal += value;
  state.lastDarts.push(value);
  turnTotalText.textContent = `Turn Total: ${state.turnTotal}`;
  haptic();
}

function hitBull(score,type) {
  if (state.mode==="random") {
    const t = state.randomTarget;
    const required = t.mult==="bull"?50:25;
    if (score !== required) {
      haptic();
      return;
    }

    state.players[state.currentPlayer].completed.push(type);
    checkWinner();
    generateRandomTarget();
  }

  state.turnTotal += score;
  state.lastDarts.push(score);
  turnTotalText.textContent = `Turn Total: ${state.turnTotal}`;
  haptic();
}

function checkWinner() {
  const p = state.players[state.currentPlayer];
  if (p.completed.length >= 22) {
    alert(`${p.name} wins!`);
  }
}

document.getElementById("undoBtn").addEventListener("click", () => {
  if (state.lastDarts.length === 0) return;
  const last = state.lastDarts.pop();
  state.turnTotal -= last;
  turnTotalText.textContent = `Turn Total: ${state.turnTotal}`;
  haptic();
});

document.getElementById("endTurnBtn").addEventListener("click", () => {
  const p = state.players[state.currentPlayer];
  p
