<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="manifest" href="manifest.json">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

<meta charset="UTF-8">

<!-- iPhone viewport (critical) -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Darts Tracker</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #fff;
    touch-action: manipulation; /* Prevents double-tap zoom */
  }

  button {
    -webkit-tap-highlight-color: transparent;
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    background: #0a84ff;
    color: #fff;
    font-size: 1rem;
    width: 100%;
    margin-top: 10px;
  }

  input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #fff;

    /* iPhone number keyboard */
    -webkit-appearance: none;
    appearance: none;
  }

  .container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
  }

  .card {
    background: #1c1c1e;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Darts Tracker</h2>
    <p>iPhone‑compatible local version</p>

    <button id="startBtn">Start Game</button>
  </div>

  <div class="card">
    <h3>Score Input</h3>
    <input id="dart1" type="number" inputmode="numeric" placeholder="Dart 1">
    <input id="dart2" type="number" inputmode="numeric" placeholder="Dart 2">
    <input id="dart3" type="number" inputmode="numeric" placeholder="Dart 3">

    <button id="saveTurn">Save Turn</button>
  </div>

  <div class="card">
    <h3>Saved Score</h3>
    <p id="savedScore">No score yet</p>
  </div>

</div>

<script>
  // --- HAPTIC FEEDBACK ---
  function haptic() {
    if (navigator.vibrate) navigator.vibrate(30);
  }

  // --- LOCAL STORAGE SAVE ---
  function saveScore(score) {
    localStorage.setItem("dartsScore", score);
  }

  function loadScore() {
    return localStorage.getItem("dartsScore") || "No score yet";
  }

  document.getElementById("savedScore").textContent = loadScore();

  // --- BUTTON ACTIONS ---
  document.getElementById("saveTurn").addEventListener("click", () => {
    const d1 = parseInt(document.getElementById("dart1").value) || 0;
    const d2 = parseInt(document.getElementById("dart2").value) || 0;
    const d3 = parseInt(document.getElementById("dart3").value) || 0;

    const total = d1 + d2 + d3;

    saveScore(total);
    document.getElementById("savedScore").textContent = total;

    haptic();
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    haptic();
    alert("Game Started");
  });
</script>

</body>
</html>
