<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Darts Tracker</title>

  <!-- iPhone / mobile viewport -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Basic theme colors -->
  <meta name="theme-color" content="#000000">

  <style>
    :root {
      --bg-light: #f5f5f5;
      --bg-dark: #000000;
      --text-light: #111;
      --text-dark: #f5f5f5;
      --accent: #0a84ff;
      --accent2: #34c759;
    }

    body.light {
      background: var(--bg-light);
      color: var(--text-light);
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
    }

    header {
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #555;
      background: transparent;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      padding: 1rem;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      border-radius: 14px;
      border: 1px solid #333;
      padding: 1rem;
      margin-bottom: 1rem;
      background: rgba(28, 28, 30, 0.9);
    }

    body.light .card {
      background: #ffffff;
      border-color: #ddd;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .row > div {
      flex: 1 1 180px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid #555;
      background: #1c1c1e;
      color: inherit;
      font-size: 0.95rem;
      -webkit-appearance: none;
      appearance: none;
    }

    body.light select,
    body.light input[type="number"],
    body.light input[type="text"] {
      background: #f5f5f5;
      border-color: #ccc;
    }

    input[type="number"] {
      inputmode: numeric;
    }

    input[type="checkbox"] {
      margin-right: 0.4rem;
    }

    button {
      padding: 0.7rem 1rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    button.secondary {
      background: var(--accent2);
      color: #fff;
    }

    button.danger {
      background: #ff3b30;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .players {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .player-card {
      border-radius: 12px;
      border: 1px solid #444;
      padding: 0.7rem 0.8rem;
      background: #2c2c2e;
    }

    body.light .player-card {
      background: #fafafa;
      border-color: #ddd;
    }

    .player-card h3 {
      margin: 0 0 0.3rem 0;
      font-size: 1rem;
    }

    .score-inputs {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .score-inputs input {
      width: 30%;
    }

    .small-text {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .checkout {
      margin-top: 0.3rem;
      font-size: 0.8rem;
    }

    .hidden {
      display: none;
    }

    .random-shot {
      margin-top: 0.6rem;
      font-size: 0.9rem;
    }

    .footer-note {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #333;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent2);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body class="dark">
  <header>
    <h1>Darts Tracker</h1>
    <button class="theme-toggle" id="themeToggle">Light</button>
  </header>

  <main>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Setup / Home Screen -->
    <section class="card" id="setupCard">
      <h2>Game Setup</h2>

      <div class="row">
        <div>
          <label for="gameMode">Game Mode</label>
          <select id="gameMode">
            <option value="around">Around the World</option>
            <option value="standard" selected>Standard (301 / 501 / 901)</option>
            <option value="random">Random Shot Selector</option>
          </select>
          <p class="small-text" id="modeNote"></p>
        </div>

        <div id="standardOptions">
          <label for="startingScore">Starting Score</label>
          <select id="startingScore">
            <option value="301">301</option>
            <option value="501" selected>501</option>
            <option value="901">901</option>
          </select>
          <label for="sets">Number of Sets</label>
          <input type="number" id="sets" min="1" value="1">
        </div>

        <div id="aroundOptions" class="hidden">
          <label>Around the World Range</label>
          <div class="row">
            <div>
              <label for="aroundStart">Start Number</label>
              <input type="number" id="aroundStart" min="1" max="20" value="1">
            </div>
            <div>
              <label for="aroundEnd">End Number</label>
              <input type="number" id="aroundEnd" min="1" max="20" value="20">
            </div>
          </div>
        </div>

        <div id="randomOptions" class="hidden">
          <label>Random Shot Selector</label>
          <p class="small-text">
            Each turn, a random target (1–20, bull, doubles, triples) is generated.
          </p>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="playerCount">Number of Players</label>
          <input type="number" id="playerCount" min="1" max="8" value="2">
        </div>
        <div>
          <label>Finish Rules</label>
          <label>
            <input type="checkbox" id="finishOnDouble" checked>
            Finish on Double
          </label>
        </div>
      </div>

      <button class="primary" id="startGameBtn">Start Game</button>
    </section>

    <!-- Game Screen -->
    <section class="card hidden" id="gameCard">
      <h2>Game In Progress</h2>
      <p class="small-text" id="gameSummary"></p>

      <div class="row">
        <div>
          <button class="secondary" id="resetGameBtn">Reset Game</button>
        </div>
      </div>

      <div class="players" id="playersContainer"></div>

      <div id="randomShotArea" class="random-shot hidden">
        <button class="secondary" id="generateShotBtn">Generate Random Shot</button>
        <p id="randomShotText"></p>
      </div>

      <p class="footer-note">
        Enter up to 3 dart scores per turn. Checkout suggestions are approximate.
      </p>
    </section>
  </main>

  <script>
    // --- PWA service worker registration ---
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    // --- Haptics ---
    function haptic() {
      if (navigator.vibrate) navigator.vibrate(30);
    }

    // --- State ---
    const state = {
      mode: "standard",
      players: [],
      currentPlayerIndex: 0,
      startingScore: 501,
      sets: 1,
      finishOnDouble: true,
      aroundStart: 1,
      aroundEnd: 20
    };

    // --- Elements ---
    const themeToggle = document.getElementById("themeToggle");
    const setupCard = document.getElementById("setupCard");
    const gameCard = document.getElementById("gameCard");
    const gameModeSelect = document.getElementById("gameMode");
    const modeNote = document.getElementById("modeNote");
    const standardOptions = document.getElementById("standardOptions");
    const aroundOptions = document.getElementById("aroundOptions");
    const randomOptions = document.getElementById("randomOptions");
    const startingScoreSelect = document.getElementById("startingScore");
    const setsInput = document.getElementById("sets");
    const playerCountInput = document.getElementById("playerCount");
    const finishOnDoubleCheckbox = document.getElementById("finishOnDouble");
    const startGameBtn = document.getElementById("startGameBtn");
    const resetGameBtn = document.getElementById("resetGameBtn");
    const playersContainer = document.getElementById("playersContainer");
    const gameSummary = document.getElementById("gameSummary");
    const randomShotArea = document.getElementById("randomShotArea");
    const generateShotBtn = document.getElementById("generateShotBtn");
    const randomShotText = document.getElementById("randomShotText");
    const aroundStartInput = document.getElementById("aroundStart");
    const aroundEndInput = document.getElementById("aroundEnd");
    const progressFill = document.getElementById("progressFill");

    // --- Theme toggle ---
    themeToggle.addEventListener("click", () => {
      const body = document.body;
      if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        body.classList.add("light");
        themeToggle.textContent = "Dark";
      } else {
        body.classList.remove("light");
        body.classList.add("dark");
        themeToggle.textContent = "Light";
      }
      haptic();
    });

    // --- Mode UI ---
    function updateModeUI() {
      const mode = gameModeSelect.value;
      state.mode = mode;

      standardOptions.classList.add("hidden");
      aroundOptions.classList.add("hidden");
      randomOptions.classList.add("hidden");
      randomShotArea.classList.add("hidden");

      if (mode === "standard") {
        standardOptions.classList.remove("hidden");
        modeNote.textContent =
          "Standard scoring game. Choose starting score and sets.";
      } else if (mode === "around") {
        aroundOptions.classList.remove("hidden");
        modeNote.textContent =
          "Hit each number in order from start to end.";
      } else if (mode === "random") {
        randomOptions.classList.remove("hidden");
        modeNote.textContent =
          "Each turn, a random target is generated.";
      } else {
        modeNote.textContent = "";
      }
    }

    gameModeSelect.addEventListener("change", updateModeUI);
    updateModeUI();

    // --- Progress bar ---
    function updateProgress() {
      if (state.mode === "around") {
        const total = state.aroundEnd - state.aroundStart + 1;
        const done = state.players.reduce(
          (acc, p) => acc + (p.aroundCurrent - state.aroundStart),
          0
        );
        const max = total * state.players.length;
        const pct = max ? (done / max) * 100 : 0;
        progressFill.style.width = pct + "%";
      } else {
        const totalStart = state.startingScore * state.players.length;
        const remaining = state.players.reduce((acc, p) => acc + p.score, 0);
        const pct = totalStart ? ((totalStart - remaining) / totalStart) * 100 : 0;
        progressFill.style.width = pct + "%";
      }
    }

    // --- Game setup ---
    startGameBtn.addEventListener("click", () => {
      const playerCount = parseInt(playerCountInput.value, 10) || 1;
      state.finishOnDouble = finishOnDoubleCheckbox.checked;
      state.startingScore = parseInt(startingScoreSelect.value, 10) || 501;
      state.sets = parseInt(setsInput.value, 10) || 1;
      state.aroundStart = parseInt(aroundStartInput.value, 10) || 1;
      state.aroundEnd = parseInt(aroundEndInput.value, 10) || 20;

      state.players = [];
      for (let i = 0; i < playerCount; i++) {
        state.players.push({
          name: `Player ${i + 1}`,
          score: state.mode === "standard" ? state.startingScore : 0,
          aroundCurrent: state.aroundStart,
          finished: false
        });
      }
      state.currentPlayerIndex = 0;

      renderGameSummary();
      renderPlayers();
      setupCard.classList.add("hidden");
      gameCard.classList.remove("hidden");
      updateProgress();
      haptic();

      if (state.mode === "random") {
        randomShotArea.classList.remove("hidden");
        generateRandomShot();
      }

      // Save basic setup to localStorage
      localStorage.setItem("dartsSetup", JSON.stringify({
        mode: state.mode,
        startingScore: state.startingScore,
        sets: state.sets,
        finishOnDouble: state.finishOnDouble,
        playerCount
      }));
    });

    resetGameBtn.addEventListener("click", () => {
      setupCard.classList.remove("hidden");
      gameCard.classList.add("hidden");
      playersContainer.innerHTML = "";
      randomShotText.textContent = "";
      progressFill.style.width = "0%";
      haptic();
    });

    // --- Rendering ---
    function renderGameSummary() {
      let text = "";
      if (state.mode === "standard") {
        text = `Mode: Standard | Starting Score: ${state.startingScore} | Sets: ${state.sets} | Finish on Double: ${
          state.finishOnDouble ? "Yes" : "No"
        }`;
      } else if (state.mode === "around") {
        text = `Mode: Around the World | Range: ${state.aroundStart}–${state.aroundEnd} | Finish on Double: ${
          state.finishOnDouble ? "Yes" : "No"
        }`;
      } else if (state.mode === "random") {
        text = `Mode: Random Shot Selector | Finish on Double: ${
          state.finishOnDouble ? "Yes" : "No"
        }`;
      }
      gameSummary.textContent = text;
    }

    function renderPlayers() {
      playersContainer.innerHTML = "";
      state.players.forEach((player, index) => {
        const card = document.createElement("div");
        card.className = "player-card";

        const title = document.createElement("h3");
        title.textContent =
          player.name +
          (index === state.currentPlayerIndex ? " (Turn)" : "");
        card.appendChild(title);

        const scoreLine = document.createElement("p");
        if (state.mode === "standard") {
          scoreLine.textContent = `Score: ${player.score}`;
        } else if (state.mode === "around") {
          scoreLine.textContent = `Current Target: ${player.aroundCurrent}`;
        } else {
          scoreLine.textContent = `Score: ${player.score}`;
        }
        card.appendChild(scoreLine);

        const checkout = document.createElement("p");
        checkout.className = "checkout";
        if (state.mode === "standard") {
          checkout.textContent = getCheckoutSuggestion(player.score);
        } else {
          checkout.textContent = "";
        }
        card.appendChild(checkout);

        const scoreInputs = document.createElement("div");
        scoreInputs.className = "score-inputs";

        const dart1 = document.createElement("input");
        dart1.type = "number";
        dart1.placeholder = "D1";

        const dart2 = document.createElement("input");
        dart2.type = "number";
        dart2.placeholder = "D2";

        const dart3 = document.createElement("input");
        dart3.type = "number";
        dart3.placeholder = "D3";

        scoreInputs.appendChild(dart1);
        scoreInputs.appendChild(dart2);
        scoreInputs.appendChild(dart3);

        const applyBtn = document.createElement("button");
        applyBtn.textContent = "Apply Turn";
        applyBtn.className = "primary";

        applyBtn.addEventListener("click", () => {
          const scores = [
            parseInt(dart1.value, 10) || 0,
            parseInt(dart2.value, 10) || 0,
            parseInt(dart3.value, 10) || 0
          ];
          handleTurn(index, scores);
          dart1.value = "";
          dart2.value = "";
          dart3.value = "";
          haptic();
        });

        card.appendChild(scoreInputs);
        card.appendChild(applyBtn);

        playersContainer.appendChild(card);
      });

      updateProgress();
    }

    // --- Turn logic ---
    function handleTurn(playerIndex, dartScores) {
      const player = state.players[playerIndex];

      if (state.mode === "standard") {
        const total = dartScores.reduce((a, b) => a + b, 0);
        let newScore = player.score - total;

        if (newScore < 0 || newScore === 1) {
          newScore = player.score;
        } else if (newScore === 0 && state.finishOnDouble) {
          const last = dartScores[dartScores.length - 1];
          const isDouble =
            (last % 2 === 0 && last <= 40) || last === 50 || last === 25;
          if (!isDouble) {
            newScore = player.score;
          }
        }

        player.score = newScore;
        if (player.score === 0) {
          alert(`${player.name} wins!`);
        }
      } else if (state.mode === "around") {
        const target = player.aroundCurrent;
        if (dartScores.includes(target)) {
          if (target < state.aroundEnd) {
            player.aroundCurrent++;
          } else {
            player.finished = true;
            alert(`${player.name} has completed Around the World!`);
          }
        }
      } else if (state.mode === "random") {
        const total = dartScores.reduce((a, b) => a + b, 0);
        player.score += total;
      }

      state.currentPlayerIndex =
        (state.currentPlayerIndex + 1) % state.players.length;

      renderPlayers();

      if (state.mode === "random") {
        generateRandomShot();
      }

      // Save scores to localStorage
      localStorage.setItem("dartsPlayers", JSON.stringify(state.players));
    }

    // --- Checkout suggestion (simple) ---
    function getCheckoutSuggestion(score) {
      if (score > 170 || score < 2) return "";
      if (score === 170) return "T20, T20, Bull";
      if (score === 167) return "T20, T19, Bull";
      if (score === 164) return "T20, T18, Bull";
      if (score === 161) return "T20, T17, Bull";
      if (score === 160) return "T20, T20, D20";
      if (score === 158) return "T20, T20, D19";
      if (score === 157) return "T20, T19, D19";
      if (score === 156) return "T20, T20, D18";
      if (score === 155) return "T20, T19, D19";
      if (score === 154) return "T20, T18, D20";
      if (score === 153) return "T20, T19, D18";
      if (score === 152) return "T20, T20, D16";
      if (score === 151) return "T20, T17, D20";
      if (score === 150) return "T20, T18, D18";
      if (score <= 100) {
        return `Try T20 then set up a double (e.g. D${score - 40}).`;
      }
      return "";
    }

    // --- Random shot selector ---
    function generateRandomShot() {
      const segments = [];
      for (let i = 1; i <= 20; i++) segments.push(i);
      segments.push("Bull");
      segments.push("Outer Bull");

      const multipliers = ["Single", "Double", "Triple"];

      const segment =
        segments[Math.floor(Math.random() * segments.length)];
      const multiplier =
        multipliers[Math.floor(Math.random() * multipliers.length)];

      randomShotText.textContent = `Target: ${multiplier} ${segment}`;
    }

    generateShotBtn.addEventListener("click", () => {
      generateRandomShot();
      haptic();
    });

    // --- Restore basic state if available ---
    (function restoreFromStorage() {
      const setup = localStorage.getItem("dartsSetup");
      const players = localStorage.getItem("dartsPlayers");
      if (!setup || !players) return;

      const s = JSON.parse(setup);
      const p = JSON.parse(players);

      state.mode = s.mode;
      state.startingScore = s.startingScore;
      state.sets = s.sets;
      state.finishOnDouble = s.finishOnDouble;
      state.players = p;
      state.currentPlayerIndex = 0;

      gameModeSelect.value = state.mode;
      startingScoreSelect.value = String(state.startingScore);
      setsInput.value = String(state.sets);
      finishOnDoubleCheckbox.checked = state.finishOnDouble;
      updateModeUI();

      setupCard.classList.add("hidden");
      gameCard.classList.remove("hidden");
      renderGameSummary();
      renderPlayers();
    })();
  </script>
</body>
</html>
